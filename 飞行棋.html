<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>自定义文字飞行棋 · 双人版</title>
    <!-- 使用 Tesseract.js 进行本地 OCR 识别 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #2e5a4c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .app {
            max-width: 950px;
            width: 100%;
            background: #fbf5e3;
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel {
            background: #fff6e6;
            border-radius: 1.8rem;
            padding: 1.5rem;
            box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #3d5a4c;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        #imgCanvas {
            width: 100%;
            border: 2px dashed #8aa392;
            border-radius: 1rem;
            background: #e9f0e6;
            touch-action: none;
            max-height: 50vh;
            object-fit: contain;
        }

        .canvas-container {
            position: relative;
            margin: 0.8rem 0;
        }

        .tool-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            margin: 0.8rem 0;
        }

        button {
            background: #c49a6c;
            border: none;
            color: white;
            font-weight: bold;
            padding: 0.6rem 1.3rem;
            border-radius: 2.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        button:active {
            transform: scale(0.96);
            background: #b07b4a;
        }

        button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .cells-table {
            width: 100%;
            border-collapse: collapse;
            background: #fefae0;
            border-radius: 1rem;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .cells-table th {
            background: #d4b68a;
            color: white;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .cells-table td {
            padding: 0.4rem;
            text-align: center;
            border-bottom: 1px solid #d9c8ab;
        }

        .cells-table input {
            width: 90%;
            padding: 0.3rem;
            border-radius: 0.5rem;
            border: 1px solid #bc9e7c;
        }

        select {
            padding: 0.4rem;
            border-radius: 2rem;
            border: 1px solid #bc9e7c;
            background: white;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: #f3e5ce;
            border-radius: 2rem;
            padding: 0.7rem 1.3rem;
            font-weight: bold;
        }

        .player-turn {
            font-size: 1.3rem;
            color: #4d3e2c;
        }

        #boardCanvas {
            width: 100%;
            border-radius: 1.5rem;
            background: #f0e2c5;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            touch-action: none;
        }

        .dice-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2.2rem;
            background: #ddc7a3;
            padding: 0.4rem 1.5rem;
            border-radius: 2.5rem;
        }

        #diceResult {
            font-weight: bold;
            transition: 0.2s;
        }

        .log-area {
            max-height: 5rem;
            overflow-y: auto;
            background: #e7dcc7;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: #3a3a2e;
        }

        .tooltip {
            position: absolute;
            background: #2e3822;
            color: #f2eace;
            padding: 0.4rem 0.9rem;
            border-radius: 0.8rem;
            font-size: 0.8rem;
            pointer-events: none;
            white-space: nowrap;
            transition: 0.1s;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 设置面板 -->
        <div id="setupPanel" class="panel">
            <h2>📸 棋盘设置 · 上传并识别格子文字</h2>
            <div class="upload-area">
                <input type="file" id="imageUpload" accept="image/*">
                <select id="ocrLang">
                    <option value="chi_sim">中文识别</option>
                    <option value="eng">English</option>
                </select>
                <span style="color:#5c6b5a; font-size:0.9rem;">上传实体棋盘照片</span>
            </div>
            <div class="canvas-container">
                <canvas id="imgCanvas" width="800" height="500"></canvas>
            </div>
            <div class="tool-row">
                <button id="recognizeBtn" disabled>🔍 识别框选区域</button>
                <button id="autoEffectBtn" disabled>✨ 自动解析特效</button>
                <button id="clearCellsBtn">🗑️ 清空格子</button>
                <span style="font-size:0.8rem; color:#5e503a;">在图片上拖拽框选格子，按路径顺序识别</span>
            </div>
            <div style="max-height: 220px; overflow-y: auto;">
                <table class="cells-table" id="cellsTable">
                    <thead><tr><th>序号</th><th>文字内容</th><th>特效类型</th><th>数值(步数)</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div style="margin-top:1rem; display: flex; gap:1rem;">
                <button id="startGameBtn" disabled>🎲 生成棋盘并开始游戏</button>
                <button id="loadDemoBtn" style="background:#8d9b82;">📋 加载演示棋盘(免识别)</button>
            </div>
        </div>

        <!-- 游戏面板 -->
        <div id="gamePanel" class="panel" style="display: none;">
            <div class="game-header">
                <span class="player-turn" id="turnIndicator">🔴 玩家1回合</span>
                <div class="dice-box">
                    <span>🎲</span>
                    <span id="diceDisplay">-</span>
                </div>
                <button id="rollDiceBtn">掷骰子</button>
            </div>
            <canvas id="boardCanvas" width="800" height="500"></canvas>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.3rem;">
                <button id="backToSetupBtn" style="background:#8e7a5c;">↩️ 返回设置</button>
                <div class="log-area" id="logDisplay">等待开始...</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 全局变量 ----------
            const setupPanel = document.getElementById('setupPanel');
            const gamePanel = document.getElementById('gamePanel');
            const imgCanvas = document.getElementById('imgCanvas');
            const ctx = imgCanvas.getContext('2d');
            const boardCanvas = document.getElementById('boardCanvas');
            const boardCtx = boardCanvas.getContext('2d');

            // 棋盘格子数据
            let cells = []; // { text, type, value }
            let originalImage = null; // HTMLImageElement 原图
            let imgScaleX = 1,
                imgScaleY = 1; // 显示/原图比例
            let selecting = false,
                selectStart = { x: 0, y: 0 },
                selectRect = null; // 当前框选 {x,y,w,h} 基于canvas坐标

            // 游戏状态
            let playerPos = [0, 0]; // 0:玩家1, 1:玩家2
            let currentPlayer = 0; // 0或1
            let skipTurn = [false, false];
            let gameOver = false;
            let boardPoints = []; // 环形路径点坐标
            let diceValue = 0;

            // ---------- 工具函数 ----------
            function addLog(msg) {
                const logDiv = document.getElementById('logDisplay');
                logDiv.innerHTML = msg + '<br>' + logDiv.innerHTML;
                logDiv.scrollTop = 0;
            }

            // ---------- 设置阶段：图片上传与框选 ----------
            document.getElementById('imageUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        originalImage = img;
                        // 调整canvas尺寸保持宽高比
                        const containerWidth = imgCanvas.parentElement.clientWidth;
                        const ratio = img.naturalHeight / img.naturalWidth;
                        const displayWidth = Math.min(containerWidth, 800);
                        const displayHeight = displayWidth * ratio;
                        imgCanvas.width = displayWidth;
                        imgCanvas.height = displayHeight;
                        imgScaleX = img.naturalWidth / displayWidth;
                        imgScaleY = img.naturalHeight / displayHeight;
                        drawImageToCanvas();
                        selectRect = null;
                        document.getElementById('recognizeBtn').disabled = true;
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            function drawImageToCanvas() {
                if (!originalImage) return;
                ctx.clearRect(0, 0, imgCanvas.width, imgCanvas.height);
                ctx.drawImage(originalImage, 0, 0, imgCanvas.width, imgCanvas.height);
                if (selectRect) {
                    ctx.strokeStyle = '#ff6600';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([6, 4]);
                    ctx.strokeRect(selectRect.x, selectRect.y, selectRect.w, selectRect.h);
                    ctx.setLineDash([]);
                }
            }

            // 鼠标/触摸事件处理框选
            function getCanvasCoords(e) {
                const rect = imgCanvas.getBoundingClientRect();
                const scaleX = imgCanvas.width / rect.width;
                const scaleY = imgCanvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function onPointerDown(e) {
                if (!originalImage) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                selecting = true;
                selectStart = coords;
                selectRect = null;
            }

            function onPointerMove(e) {
                if (!selecting || !originalImage) return;
                e.preventDefault();
                const coords = getCanvasCoords(e);
                const x = Math.min(selectStart.x, coords.x);
                const y = Math.min(selectStart.y, coords.y);
                const w = Math.abs(coords.x - selectStart.x);
                const h = Math.abs(coords.y - selectStart.y);
                if (w > 5 && h > 5) {
                    selectRect = { x, y, w, h };
                    drawImageToCanvas();
                    document.getElementById('recognizeBtn').disabled = false;
                }
            }

            function onPointerUp(e) {
                if (!selecting) return;
                selecting = false;
                if (selectRect && selectRect.w > 10 && selectRect.h > 10) {
                    document.getElementById('recognizeBtn').disabled = false;
                }
            }

            imgCanvas.addEventListener('mousedown', onPointerDown);
            imgCanvas.addEventListener('mousemove', onPointerMove);
            imgCanvas.addEventListener('mouseup', onPointerUp);
            imgCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
            imgCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
            imgCanvas.addEventListener('touchend', onPointerUp);

            // OCR 识别框选区域
            document.getElementById('recognizeBtn').addEventListener('click', async function() {
                if (!originalImage || !selectRect) return;
                const btn = this;
                btn.disabled = true;
                btn.textContent = '识别中...';
                const lang = document.getElementById('ocrLang').value;
                // 转换为原图坐标
                const rect = {
                    left: Math.round(selectRect.x * imgScaleX),
                    top: Math.round(selectRect.y * imgScaleY),
                    width: Math.round(selectRect.w * imgScaleX),
                    height: Math.round(selectRect.h * imgScaleY),
                };
                try {
                    const { data } = await Tesseract.recognize(originalImage, lang, {
                        rectangle: rect
                    });
                    const text = data.text.replace(/\s+/g, '').trim();
                    if (!text) {
                        alert('未识别到文字，请重新框选');
                        btn.disabled = false;
                        btn.textContent = '🔍 识别框选区域';
                        return;
                    }
                    // 添加新格子
                    cells.push({ text: text, type: 'normal', value: 0 });
                    renderCellsTable();
                    addLog(`已添加格子: ${text}`);
                    document.getElementById('startGameBtn').disabled = false;
                    document.getElementById('autoEffectBtn').disabled = false;
                } catch (err) {
                    alert('识别失败: ' + err.message);
                }
                btn.disabled = false;
                btn.textContent = '🔍 识别框选区域';
                selectRect = null;
                drawImageToCanvas();
            });

            // 渲染已识别格子表格
            function renderCellsTable() {
                const tbody = document.querySelector('#cellsTable tbody');
                tbody.innerHTML = '';
                cells.forEach((cell, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${idx+1}</td>
                        <td><input type="text" value="${escapeHtml(cell.text)}" data-idx="${idx}" class="cell-text"></td>
                        <td>
                            <select data-idx="${idx}" class="cell-type">
                                <option value="normal" ${cell.type==='normal'?'selected':''}>普通</option>
                                <option value="forward" ${cell.type==='forward'?'selected':''}>前进</option>
                                <option value="backward" ${cell.type==='backward'?'selected':''}>后退</option>
                                <option value="pause" ${cell.type==='pause'?'selected':''}>暂停一轮</option>
                                <option value="start" ${cell.type==='start'?'selected':''}>回起点</option>
                                <option value="end" ${cell.type==='end'?'selected':''}>直达终点</option>
                            </select>
                        </td>
                        <td><input type="number" value="${cell.value}" data-idx="${idx}" class="cell-value" style="width:60px;" min="0"></td>
                    `;
                    tbody.appendChild(tr);
                });
                // 绑定编辑事件
                document.querySelectorAll('.cell-text').forEach(inp => {
                    inp.addEventListener('change', function() {
                        const idx = this.dataset.idx;
                        cells[idx].text = this.value;
                    });
                });
                document.querySelectorAll('.cell-type').forEach(sel => {
                    sel.addEventListener('change', function() {
                        const idx = this.dataset.idx;
                        cells[idx].type = this.value;
                    });
                });
                document.querySelectorAll('.cell-value').forEach(inp => {
                    inp.addEventListener('change', function() {
                        const idx = this.dataset.idx;
                        cells[idx].value = parseInt(this.value) || 0;
                    });
                });
                document.getElementById('startGameBtn').disabled = cells.length < 2;
                document.getElementById('autoEffectBtn').disabled = cells.length === 0;
            }

            function escapeHtml(text) {
                return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,
                    '&quot;');
            }

            // 自动解析特效
            document.getElementById('autoEffectBtn').addEventListener('click', function() {
                cells.forEach(cell => {
                    const txt = cell.text;
                    if (/前进(\d+)步/.test(txt)) {
                        cell.type = 'forward';
                        cell.value = parseInt(txt.match(/前进(\d+)步/)[1]);
                    } else if (/后退(\d+)步/.test(txt)) {
                        cell.type = 'backward';
                        cell.value = parseInt(txt.match(/后退(\d+)步/)[1]);
                    } else if (/暂停|休息一轮/.test(txt)) {
                        cell.type = 'pause';
                        cell.value = 0;
                    } else if (/回到起点/.test(txt)) {
                        cell.type = 'start';
                        cell.value = 0;
                    } else if (/直达终点|直接获胜/.test(txt)) {
                        cell.type = 'end';
                        cell.value = 0;
                    } else {
                        cell.type = 'normal';
                        cell.value = 0;
                    }
                });
                renderCellsTable();
                addLog('✨ 已自动解析所有格子特效，请检查并调整。');
            });

            document.getElementById('clearCellsBtn').addEventListener('click', function() {
                cells = [];
                renderCellsTable();
                document.getElementById('startGameBtn').disabled = true;
                document.getElementById('autoEffectBtn').disabled = true;
                addLog('格子已清空');
            });

            // 演示棋盘（无需识别）
            document.getElementById('loadDemoBtn').addEventListener('click', function() {
                cells = [
                    { text: '⚡向前三步', type: 'forward', value: 3 },
                    { text: '🌿休息一回合', type: 'pause', value: 0 },
                    { text: '🌀后退两步', type: 'backward', value: 2 },
                    { text: '🏁直达终点', type: 'end', value: 0 },
                    { text: '普通格', type: 'normal', value: 0 },
                    { text: '🔙回到起点', type: 'start', value: 0 },
                    { text: '⭐奖励前进1', type: 'forward', value: 1 },
                    { text: '🎯终点', type: 'normal', value: 0 },
                ];
                renderCellsTable();
                document.getElementById('startGameBtn').disabled = false;
                addLog('📋 已加载演示棋盘，可直接开始游戏');
            });

            // ---------- 开始游戏 ----------
            document.getElementById('startGameBtn').addEventListener('click', function() {
                if (cells.length < 2) return;
                // 初始化游戏状态
                playerPos = [0, 0];
                currentPlayer = 0;
                skipTurn = [false, false];
                gameOver = false;
                diceValue = 0;
                document.getElementById('diceDisplay').textContent = '-';
                setupPanel.style.display = 'none';
                gamePanel.style.display = 'block';
                updateTurnIndicator();
                computeBoardPoints();
                drawBoard();
                addLog('游戏开始！玩家1先手。');
            });

            document.getElementById('backToSetupBtn').addEventListener('click', function() {
                gamePanel.style.display = 'none';
                setupPanel.style.display = 'block';
            });

            // 计算环形路径点
            function computeBoardPoints() {
                const w = boardCanvas.width;
                const h = boardCanvas.height;
                const margin = 60;
                const rectW = w - margin * 2;
                const rectH = h - margin * 2;
                const left = margin;
                const right = margin + rectW;
                const top = margin;
                const bottom = margin + rectH;
                const perimeter = 2 * (rectW + rectH);
                const total = cells.length;
                const segLen = perimeter / total;
                boardPoints = [];
                for (let i = 0; i < total; i++) {
                    let dist = i * segLen;
                    let x, y;
                    if (dist <= rectW) {
                        // 底边从左到右
                        x = left + dist;
                        y = bottom;
                    } else if (dist <= rectW + rectH) {
                        // 右边从下到上
                        x = right;
                        y = bottom - (dist - rectW);
                    } else if (dist <= 2 * rectW + rectH) {
                        // 顶边从右到左
                        x = right - (dist - rectW - rectH);
                        y = top;
                    } else {
                        // 左边从上到下
                        x = left;
                        y = top + (dist - 2 * rectW - rectH);
                    }
                    boardPoints.push({ x, y });
                }
            }

            // 绘制棋盘
            function drawBoard() {
                boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
                if (!boardPoints.length) return;
                // 画连接线
                boardCtx.beginPath();
                boardCtx.strokeStyle = '#b0906a';
                boardCtx.lineWidth = 4;
                boardCtx.moveTo(boardPoints[0].x, boardPoints[0].y);
                for (let i = 1; i < boardPoints.length; i++) {
                    boardCtx.lineTo(boardPoints[i].x, boardPoints[i].y);
                }
                boardCtx.stroke();

                // 画格子
                const cellWidth = Math.min(55, (boardCanvas.width / cells.length) * 1.4);
                boardPoints.forEach((pt, i) => {
                    const cell = cells[i];
                    boardCtx.fillStyle = '#fcf3e0';
                    boardCtx.strokeStyle = '#7e6b4f';
                    boardCtx.lineWidth = 2;
                    boardCtx.beginPath();
                    boardCtx.roundRect(pt.x - cellWidth / 2, pt.y - 22, cellWidth, 44, 10);
                    boardCtx.fill();
                    boardCtx.stroke();
                    boardCtx.fillStyle = '#3e2e1c';
                    boardCtx.font = 'bold 12px system-ui';
                    boardCtx.textAlign = 'center';
                    boardCtx.fillText(`${i+1}`, pt.x, pt.y - 4);
                    const shortText = cell.text.length > 3 ? cell.text.slice(0, 3) + '…' : cell.text;
                    boardCtx.font = '10px system-ui';
                    boardCtx.fillText(shortText, pt.x, pt.y + 14);
                });

                // 画棋子
                drawPlayerPiece(0, playerPos[0], '#d94f4f');
                drawPlayerPiece(1, playerPos[1], '#3f6e9c');
            }

            function drawPlayerPiece(playerIndex, posIndex, color) {
                if (posIndex < 0 || posIndex >= boardPoints.length) return;
                const pt = boardPoints[posIndex];
                const offsetX = playerIndex === 0 ? -14 : 14;
                boardCtx.beginPath();
                boardCtx.arc(pt.x + offsetX, pt.y - 6, 12, 0, 2 * Math.PI);
                boardCtx.fillStyle = color;
                boardCtx.fill();
                boardCtx.strokeStyle = 'white';
                boardCtx.lineWidth = 2;
                boardCtx.stroke();
                boardCtx.fillStyle = 'white';
                boardCtx.font = 'bold 10px system-ui';
                boardCtx.textAlign = 'center';
                boardCtx.fillText(playerIndex === 0 ? '1' : '2', pt.x + offsetX, pt.y - 2);
            }

            // 回合控制
            document.getElementById('rollDiceBtn').addEventListener('click', async function() {
                if (gameOver) return;
                if (skipTurn[currentPlayer]) {
                    addLog(`玩家${currentPlayer+1} 被暂停，跳过回合`);
                    skipTurn[currentPlayer] = false;
                    switchPlayer();
                    return;
                }
                this.disabled = true;
                // 模拟掷骰子
                diceValue = Math.floor(Math.random() * 6) + 1;
                document.getElementById('diceDisplay').textContent = diceValue;
                addLog(`玩家${currentPlayer+1} 掷出 ${diceValue}`);
                await movePlayer(currentPlayer, diceValue);
                if (!gameOver) {
                    switchPlayer();
                }
                this.disabled = false;
            });

            async function movePlayer(player, steps) {
                let pos = playerPos[player];
                for (let i = 0; i < steps; i++) {
                    if (gameOver) return;
                    pos = Math.min(pos + 1, cells.length - 1);
                    playerPos[player] = pos;
                    drawBoard();
                    await sleep(250);
                    if (pos === cells.length - 1) {
                        gameOver = true;
                        addLog(`🎉 玩家${player+1} 到达终点，获胜！`);
                        drawBoard();
                        return;
                    }
                }
                // 触发所在格特效
                await applyCellEffect(player, pos, 0);
            }

            async function applyCellEffect(player, pos, depth) {
                if (depth > 5 || gameOver) return; // 防止无限循环
                const cell = cells[pos];
                if (!cell) return;
                addLog(`玩家${player+1} 到达第${pos+1}格：${cell.text}`);
                switch (cell.type) {
                    case 'forward':
                        const fwd = cell.value || 1;
                        addLog(`  前进${fwd}步`);
                        for (let i = 0; i < fwd; i++) {
                            let newPos = Math.min(playerPos[player] + 1, cells.length - 1);
                            playerPos[player] = newPos;
                            drawBoard();
                            await sleep(250);
                            if (newPos === cells.length - 1) {
                                gameOver = true;
                                addLog(`🎉 玩家${player+1} 到达终点！`);
                                return;
                            }
                        }
                        await applyCellEffect(player, playerPos[player], depth + 1);
                        break;
                    case 'backward':
                        const bwd = cell.value || 1;
                        addLog(`  后退${bwd}步`);
                        for (let i = 0; i < bwd; i++) {
                            playerPos[player] = Math.max(playerPos[player] - 1, 0);
                            drawBoard();
                            await sleep(250);
                        }
                        await applyCellEffect(player, playerPos[player], depth + 1);
                        break;
                    case 'pause':
                        skipTurn[player] = true;
                        addLog(`  玩家${player+1} 下一回合暂停`);
                        break;
                    case 'start':
                        playerPos[player] = 0;
                        addLog(`  回到起点`);
                        drawBoard();
                        await sleep(300);
                        break;
                    case 'end':
                        playerPos[player] = cells.length - 1;
                        addLog(`  直达终点`);
                        drawBoard();
                        await sleep(300);
                        gameOver = true;
                        break;
                    default:
                        break;
                }
                if (playerPos[player] === cells.length - 1) gameOver = true;
            }

            function switchPlayer() {
                currentPlayer = currentPlayer === 0 ? 1 : 0;
                updateTurnIndicator();
                if (skipTurn[currentPlayer]) {
                    addLog(`玩家${currentPlayer+1} 被暂停，自动跳过`);
                    skipTurn[currentPlayer] = false;
                    switchPlayer();
                }
            }

            function updateTurnIndicator() {
                const el = document.getElementById('turnIndicator');
                if (gameOver) {
                    el.textContent = `🏆 玩家${currentPlayer+1} 获胜！`;
                    return;
                }
                el.innerHTML = currentPlayer === 0 ? '🔴 玩家1回合' : '🔵 玩家2回合';
            }

            function sleep(ms) {
                return new Promise(res => setTimeout(res, ms));
            }

            // 棋盘悬停显示详细文字
            boardCanvas.addEventListener('mousemove', function(e) {
                const rect = boardCanvas.getBoundingClientRect();
                const scaleX = boardCanvas.width / rect.width;
                const scaleY = boardCanvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;
                let tooltip = document.getElementById('boardTooltip');
                if (!tooltip) {
                    tooltip = document.createElement('div');
                    tooltip.id = 'boardTooltip';
                    tooltip.className = 'tooltip';
                    document.body.appendChild(tooltip);
                }
                const threshold = 30;
                let found = null;
                boardPoints.forEach((pt, idx) => {
                    const dx = mouseX - pt.x;
                    const dy = mouseY - pt.y;
                    if (Math.sqrt(dx * dx + dy * dy) < threshold) {
                        found = idx;
                    }
                });
                if (found !== null) {
                    tooltip.style.display = 'block';
                    tooltip.textContent = `第${found+1}格: ${cells[found].text}`;
                    tooltip.style.left = (e.clientX + 18) + 'px';
                    tooltip.style.top = (e.clientY - 30) + 'px';
                } else {
                    tooltip.style.display = 'none';
                }
            });
            boardCanvas.addEventListener('mouseleave', function() {
                const tooltip = document.getElementById('boardTooltip');
                if (tooltip) tooltip.style.display = 'none';
            });

            // 窗口大小改变重绘
            window.addEventListener('resize', () => {
                if (gamePanel.style.display !== 'none' && boardPoints.length) {
                    computeBoardPoints();
                    drawBoard();
                }
                if (originalImage) drawImageToCanvas();
            });

            // 初始化画布尺寸
            function resizeBoardCanvas() {
                const container = boardCanvas.parentElement;
                boardCanvas.width = container.clientWidth || 800;
                boardCanvas.height = Math.min(500, window.innerHeight * 0.55);
                if (cells.length) computeBoardPoints();
                drawBoard();
            }
            new ResizeObserver(() => {
                if (gamePanel.style.display !== 'none') resizeBoardCanvas();
            }).observe(boardCanvas.parentElement);
            resizeBoardCanvas();

            // roundRect polyfill
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    this.beginPath();
                    this.moveTo(x + r.tl, y);
                    this.lineTo(x + w - r.tr, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    this.lineTo(x + w, y + h - r.br);
                    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    this.lineTo(x + r.bl, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    this.lineTo(x, y + r.tl);
                    this.quadraticCurveTo(x, y, x + r.tl, y);
                    this.closePath();
                };
            }
        })();
    </script>
</body>
</html>
